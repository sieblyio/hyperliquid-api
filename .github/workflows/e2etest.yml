name: E2ETests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  E2ETests:
    name: 'Build & Test'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout source code'
        uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: 'Use pinned npm'
        run: npm install --global --ignore-scripts npm@11.12.0

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run test:types

      - name: Test focused units
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Test packed package
        run: node test/packaging/packed-consumer-smoke.mjs

      - name: Test Public REST API Calls
        run: npm run test -- public.test.ts

      - name: Test Public WebSocket Connections (Mainnet and Testnet)
        run: npm run test -- public.ws.test.ts

      # Private live tests. HYPERLIQUID_E2E_PRIVATE_KEY is required or those
      # suites skip. The other two secrets are optional:
      # - HYPERLIQUID_E2E_ACCOUNT_ADDRESS: master/sub address when the key is an
      #   API wallet (agent). Info reads cannot resolve userRole for a missing
      #   signer. Omit when the private key is the account itself; tests derive
      #   that address from the key.
      # - HYPERLIQUID_E2E_VAULT_ADDRESS: subaccount/vault to hit on L1 writes
      #   via the vaultAddress envelope field. Omit to skip that one case.
      - name: Test Private Read API Calls
        run: npm run test -- private.read.test.ts
        env:
          HYPERLIQUID_E2E_ACCOUNT_ADDRESS: ${{ secrets.HYPERLIQUID_E2E_ACCOUNT_ADDRESS }}
          HYPERLIQUID_E2E_PRIVATE_KEY: ${{ secrets.HYPERLIQUID_E2E_PRIVATE_KEY }}
          HYPERLIQUID_E2E_VAULT_ADDRESS: ${{ secrets.HYPERLIQUID_E2E_VAULT_ADDRESS }}

      - name: Test Private Write API Calls
        run: npm run test -- private.write.test.ts
        env:
          HYPERLIQUID_E2E_ACCOUNT_ADDRESS: ${{ secrets.HYPERLIQUID_E2E_ACCOUNT_ADDRESS }}
          HYPERLIQUID_E2E_PRIVATE_KEY: ${{ secrets.HYPERLIQUID_E2E_PRIVATE_KEY }}
          HYPERLIQUID_E2E_VAULT_ADDRESS: ${{ secrets.HYPERLIQUID_E2E_VAULT_ADDRESS }}
